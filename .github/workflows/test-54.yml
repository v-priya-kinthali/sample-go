name: Verify Go environment outputs

on:
  push:
    branches: [test-375-fr]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  outputs:
    name: Outputs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Set up Go
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: stable
          cache: false

      - name: Verify version and direct go env outputs
        env:
          OUT_VERSION: ${{ steps.setup-go.outputs.go-version }}
          OUT_GOPATH: ${{ steps.setup-go.outputs.go-path }}
          OUT_GOBIN: ${{ steps.setup-go.outputs.go-bin }}
          OUT_GOROOT: ${{ steps.setup-go.outputs.go-root }}
          OUT_GOCACHE: ${{ steps.setup-go.outputs.go-cache }}
          OUT_GOMODCACHE: ${{ steps.setup-go.outputs.go-mod-cache }}
          OUT_GOOS: ${{ steps.setup-go.outputs.go-os }}
          OUT_GOARCH: ${{ steps.setup-go.outputs.go-arch }}
          OUT_GOTOOLDIR: ${{ steps.setup-go.outputs.go-tool-dir }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        run: |
          actual_version="$(go version | awk '{sub(/^go/, "", $3); print $3}')"
          test "$OUT_VERSION" = "$actual_version"
          test "$OUT_GOPATH" = "$(go env GOPATH)"
          test "$OUT_GOBIN" = "$(go env GOBIN)"
          test "$OUT_GOROOT" = "$(go env GOROOT)"
          test "$OUT_GOCACHE" = "$(go env GOCACHE)"
          test "$OUT_GOMODCACHE" = "$(go env GOMODCACHE)"
          test "$OUT_GOOS" = "$(go env GOOS)"
          test "$OUT_GOARCH" = "$(go env GOARCH)"
          test "$OUT_GOTOOLDIR" = "$(go env GOTOOLDIR)"
          test -n "$OUT_BIN_PATH"

  gopath-fallback:
    name: GOPATH fallback
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: 1.25.5
          cache: false
      - name: Verify GOPATH/bin fallback
        env:
          OUT_GOBIN: ${{ steps.setup-go.outputs.go-bin }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        run: |
          test -z "$OUT_GOBIN"
          test "$OUT_BIN_PATH" = "$(go env GOPATH)/bin"

  explicit-gobin:
    name: Explicit GOBIN
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/custom-gobin
    steps:
      - name: Set up Go
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: stable
          cache: false
      - name: Verify GOBIN takes precedence
        env:
          OUT_GOBIN: ${{ steps.setup-go.outputs.go-bin }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        run: |
          test "$OUT_GOBIN" = "$GOBIN"
          test "$OUT_BIN_PATH" = "$GOBIN"

  multi-entry-gopath:
    name: First GOPATH entry
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}/gopath-one:${{ github.workspace }}/gopath-two
    steps:
      - name: Set up Go
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: stable
          cache: false
      - name: Verify only the first GOPATH entry is used
        env:
          OUT_GOPATH: ${{ steps.setup-go.outputs.go-path }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        run: |
          test "$OUT_GOPATH" = "$GOPATH"
          test "$OUT_BIN_PATH" = "$GITHUB_WORKSPACE/gopath-one/bin"

  pre-json-go:
    name: Go 1.8 without go env JSON
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: 1.8.7
          cache: false
      - name: Verify unsupported go env JSON is non-fatal
        env:
          OUT_GOPATH: ${{ steps.setup-go.outputs.go-path }}
          OUT_GOBIN: ${{ steps.setup-go.outputs.go-bin }}
          OUT_GOROOT: ${{ steps.setup-go.outputs.go-root }}
          OUT_GOCACHE: ${{ steps.setup-go.outputs.go-cache }}
          OUT_GOMODCACHE: ${{ steps.setup-go.outputs.go-mod-cache }}
          OUT_GOOS: ${{ steps.setup-go.outputs.go-os }}
          OUT_GOARCH: ${{ steps.setup-go.outputs.go-arch }}
          OUT_GOTOOLDIR: ${{ steps.setup-go.outputs.go-tool-dir }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        run: |
          test "${{ steps.setup-go.outcome }}" = success
          test -z "$OUT_GOPATH"
          test -z "$OUT_GOBIN"
          test -z "$OUT_BIN_PATH"
          test -z "$OUT_GOROOT"
          test -z "$OUT_GOCACHE"
          test -z "$OUT_GOMODCACHE"
          test -z "$OUT_GOOS"
          test -z "$OUT_GOARCH"
          test -z "$OUT_GOTOOLDIR"

  compatibility:
    name: Compatibility boundary Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.9.7
          - 1.10.8
          - 1.15.15
    steps:
      - name: Set up Go
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify available environment outputs
        env:
          OUT_GOPATH: ${{ steps.setup-go.outputs.go-path }}
          OUT_GOBIN: ${{ steps.setup-go.outputs.go-bin }}
          OUT_GOROOT: ${{ steps.setup-go.outputs.go-root }}
          OUT_GOCACHE: ${{ steps.setup-go.outputs.go-cache }}
          OUT_GOMODCACHE: ${{ steps.setup-go.outputs.go-mod-cache }}
          OUT_GOOS: ${{ steps.setup-go.outputs.go-os }}
          OUT_GOARCH: ${{ steps.setup-go.outputs.go-arch }}
          OUT_GOTOOLDIR: ${{ steps.setup-go.outputs.go-tool-dir }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
        run: |
          test "$OUT_GOPATH" = "$(go env GOPATH)"
          test "$OUT_GOBIN" = "$(go env GOBIN)"
          test "$OUT_GOROOT" = "$(go env GOROOT)"
          test "$OUT_GOCACHE" = "$(go env GOCACHE)"
          test "$OUT_GOMODCACHE" = "$(go env GOMODCACHE)"
          test "$OUT_GOOS" = "$(go env GOOS)"
          test "$OUT_GOARCH" = "$(go env GOARCH)"
          test "$OUT_GOTOOLDIR" = "$(go env GOTOOLDIR)"
          test "$OUT_BIN_PATH" = "$(go env GOPATH)/bin"

  missing-go-env-keys:
    name: Missing go env keys become empty outputs
    runs-on: ubuntu-latest
    steps:
      - name: Put a partial fake Go first on PATH
        run: |
          fake_bin="$RUNNER_TEMP/fake-go/bin"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/go" <<'SCRIPT'
          #!/usr/bin/env bash
          case "$*" in
            version) echo 'go version go1.25.5 linux/amd64' ;;
            'env GOPATH') echo "$RUNNER_TEMP/partial-gopath" ;;
            'env -json') echo '{"GOPATH":"'"$RUNNER_TEMP"'/partial-gopath"}' ;;
            env) echo 'GOPATH='"$RUNNER_TEMP/partial-gopath" ;;
          esac
          SCRIPT
          chmod +x "$fake_bin/go"
          echo "$fake_bin" >> "$GITHUB_PATH"
      - name: Run action with partial go env JSON
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          cache: false
      - name: Verify missing values and GOPATH fallback
        env:
          OUT_GOPATH: ${{ steps.setup-go.outputs.go-path }}
          OUT_GOBIN: ${{ steps.setup-go.outputs.go-bin }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
          OUT_GOROOT: ${{ steps.setup-go.outputs.go-root }}
          OUT_GOCACHE: ${{ steps.setup-go.outputs.go-cache }}
          OUT_GOMODCACHE: ${{ steps.setup-go.outputs.go-mod-cache }}
          OUT_GOOS: ${{ steps.setup-go.outputs.go-os }}
          OUT_GOARCH: ${{ steps.setup-go.outputs.go-arch }}
          OUT_GOTOOLDIR: ${{ steps.setup-go.outputs.go-tool-dir }}
        run: |
          test "$OUT_GOPATH" = "$RUNNER_TEMP/partial-gopath"
          test -z "$OUT_GOBIN"
          test "$OUT_BIN_PATH" = "$RUNNER_TEMP/partial-gopath/bin"
          test -z "$OUT_GOROOT"
          test -z "$OUT_GOCACHE"
          test -z "$OUT_GOMODCACHE"
          test -z "$OUT_GOOS"
          test -z "$OUT_GOARCH"
          test -z "$OUT_GOTOOLDIR"

  invalid-json:
    name: Non-fatal go env (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: invalid JSON, mode: output, json: not-json}
          - {case: JSON array, mode: output, json: '[]'}
          - {case: empty object, mode: output, json: '{}'}
          - {case: command failure, mode: failure, json: '{}'}
    env:
      FAKE_GO_MODE: ${{ matrix.mode }}
      FAKE_GO_JSON: ${{ matrix.json }}
    steps:
      - name: Put a deterministic fake Go first on PATH
        run: |
          fake_bin="$RUNNER_TEMP/fake-go/bin"
          mkdir -p "$fake_bin"
          cat > "$fake_bin/go" <<'SCRIPT'
          #!/usr/bin/env bash
          case "$*" in
            version) echo 'go version go1.25.5 linux/amd64' ;;
            'env GOPATH') echo "$RUNNER_TEMP/fake-gopath" ;;
            'env -json')
              [[ "$FAKE_GO_MODE" == failure ]] && exit 1
              echo "$FAKE_GO_JSON"
              ;;
            env) echo 'GOPATH='"$RUNNER_TEMP/fake-gopath" ;;
            *) exit 1 ;;
          esac
          SCRIPT
          chmod +x "$fake_bin/go"
          echo "$fake_bin" >> "$GITHUB_PATH"
      - name: Run action against invalid JSON
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          cache: false
      - name: Verify action succeeded without environment outputs
        env:
          OUT_GOPATH: ${{ steps.setup-go.outputs.go-path }}
          OUT_GOBIN: ${{ steps.setup-go.outputs.go-bin }}
          OUT_BIN_PATH: ${{ steps.setup-go.outputs.go-bin-path }}
          OUT_GOROOT: ${{ steps.setup-go.outputs.go-root }}
          OUT_GOCACHE: ${{ steps.setup-go.outputs.go-cache }}
          OUT_GOMODCACHE: ${{ steps.setup-go.outputs.go-mod-cache }}
          OUT_GOOS: ${{ steps.setup-go.outputs.go-os }}
          OUT_GOARCH: ${{ steps.setup-go.outputs.go-arch }}
          OUT_GOTOOLDIR: ${{ steps.setup-go.outputs.go-tool-dir }}
        run: |
          test "${{ steps.setup-go.outcome }}" = success
          test "${{ steps.setup-go.outputs.go-version }}" = 1.25.5
          test -z "$OUT_GOPATH"
          test -z "$OUT_GOBIN"
          test -z "$OUT_BIN_PATH"
          test -z "$OUT_GOROOT"
          test -z "$OUT_GOCACHE"
          test -z "$OUT_GOMODCACHE"
          test -z "$OUT_GOOS"
          test -z "$OUT_GOARCH"
          test -z "$OUT_GOTOOLDIR"